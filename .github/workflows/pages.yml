# Builds BIM2BEM and publishes it to GitHub Pages, with the EnergyPlus WebAssembly
# assets copied next to the site so the engine loads from the same origin.
# Repository settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and test
        run: npm test
      - name: Assemble the site
        run: |
          node scripts/vendor.mjs --engine
          echo "window.ENGINE_LOCAL_ASSETS = true;" > assets/js/data/engine-config.js
          mkdir _site
          cp -r index.html site.webmanifest sitemap.xml LICENSE assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
