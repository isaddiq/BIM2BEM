<script>
  // Apply the saved or system theme before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem('bim2bem-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script>
  const { useCallback, useEffect, useMemo, useReducer, useRef, useState } = React;
</script>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
window.THREE = THREE;

// Each compiled script is an IIFE that publishes its API on window; order matters.
// The EnergyPlus engine is not listed: it loads on the first simulation (assets/js/core/engine.jsx).
const appScripts = [
  'assets/vendor/polygon-clipping.umd.min.js',
  'assets/vendor/earcut.min.js',
  'assets/js/data/ep-schema.js',
  'assets/js/data/ep-stations.js',
  'assets/js/data/engine-config.js',
  'assets/js/compiled/core/schema.js',
  'assets/js/compiled/core/ifcloader.js',
  'assets/js/compiled/core/building.js',
  'assets/js/compiled/core/plan.js',
  'assets/js/compiled/core/geom.js',
  'assets/js/compiled/core/materials.js',
  'assets/js/compiled/core/idf.js',
  'assets/js/compiled/core/weather.js',
  'assets/js/compiled/core/comfort.js',
  'assets/js/compiled/core/bem.js',
  'assets/js/compiled/core/epmodel.js',
  'assets/js/compiled/core/results.js',
  'assets/js/compiled/core/engine.js',
  'assets/js/compiled/viewer/viewer.js',
  'assets/js/compiled/viewer/viewcube.js',
  'assets/js/compiled/ui/icons.js',
  'assets/js/compiled/ui/panels.js',
  'assets/js/compiled/ui/charts.js',
  'assets/js/compiled/ui/planview.js',
  'assets/js/compiled/ui/location.js',
  'assets/js/compiled/ui/bemui.js',
  'assets/js/compiled/ui/bemview.js',
  'assets/js/compiled/ui/analysis.js',
  'assets/js/compiled/ui/reports.js',
  'assets/js/compiled/app.js',
];

try {
  await Promise.all(appScripts.map(src => new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.async = false;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.head.appendChild(script);
  })));
} catch (err) {
  document.getElementById('root').innerHTML = '<div class="boot-error"><h1>BIM2BEM could not start</h1><p>' + err.message + '. Serve the folder over HTTP (for example <code>npx serve .</code>) instead of opening the file directly.</p></div>';
}
</script>
</head>

<main id="root">
  <noscript><div class="boot-error"><h1>BIM2BEM</h1><p>BIM2BEM needs JavaScript and WebAssembly to read IFC files and run EnergyPlus in your browser.</p></div></noscript>
</main>
